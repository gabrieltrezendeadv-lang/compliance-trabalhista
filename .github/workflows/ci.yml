name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # GATE BLOQUEANTE — lint + typecheck + testes + build
  # ══════════════════════════════════════════════════════════════════════════
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Piso real da toolchain de testes: Node >= 20.19.0
          # (vite@8, jsdom@29). Fixado em 22 LTS por margem.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (lint + typecheck + test + build)
        run: npm run verify

      - name: Coverage report
        if: always()
        run: npx --no-install vitest run --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════════
  # GATE BLOQUEANTE — E2E sem banco e sem credenciais
  # ══════════════════════════════════════════════════════════════════════════
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --with-deps é necessário no runner Linux (bibliotecas de sistema).
      # Localmente, no Windows, usa-se apenas `playwright install chromium`.
      - name: Install Playwright browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════════
  # INFORMATIVO — não bloqueia o merge
  #
  # A linha de base é de 12 vulnerabilidades altas, todas de build-time/
  # dev-time, em duas cadeias transitivas (brace-expansion→minimatch→eslint e
  # postcss/sharp→next). Os "fixes" propostos pelo npm são destrutivos
  # (next@9.3.3, eslint-config-next@0.2.4), por isso `npm audit fix` NÃO é
  # executado — nem aqui, nem localmente.
  #
  # continue-on-error preserva o código de saída real do comando: a falha
  # aparece no log e no resumo do job, mas não reprova o PR.
  # ══════════════════════════════════════════════════════════════════════════
  audit:
    name: Dependency audit (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit (high)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Save audit report
        if: always()
        continue-on-error: true
        run: npm audit --json > npm-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: npm-audit.json
          retention-days: 30
