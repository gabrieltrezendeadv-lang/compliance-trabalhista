name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # GATE BLOQUEANTE — lint + typecheck + testes + build
  # ══════════════════════════════════════════════════════════════════════════
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Piso real da toolchain de testes: Node >= 20.19.0
          # (vite@8, jsdom@29). Fixado em 22 LTS por margem.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (lint + typecheck + test + build)
        run: npm run verify

      # Sem `if: always()`: cobertura só faz sentido quando instalação e verify
      # passaram. Rodá-la após falha produzia um segundo erro que mascarava a
      # causa real (foi o que aconteceu na execução 30461227692, onde o npm ci
      # falhou e este passo falhou em seguida por motivo derivado).
      - name: Coverage report
        run: npx --no-install vitest run --coverage

      # O upload permanece com `if: always()` para preservar cobertura parcial
      # quando o passo anterior falha. `if-no-files-found: ignore` garante que
      # a ausência do diretório não acrescente uma falha própria.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      # ────────────────────────────────────────────────────────────────────
      # EXECUTE PARA PUBLIC — promovida a verificação obrigatória
      #
      # Até a Fase 6B.1 esta asserção só rodava no migration-rebuild-verify,
      # que é manual. Ou seja: o defeito que ela detecta podia entrar na main
      # sem que nada reclamasse — e foi exatamente assim que
      # `fn_process_webhook_event`, SECURITY DEFINER, ficou executável por
      # PUBLIC em qualquer ambiente reconstruído a partir do repositório
      # (Fase 4C). A causa raiz é `sec001` ter delegado
      # `ALTER DEFAULT PRIVILEGES` a um passo manual de dashboard: toda função
      # criada depois nasce com EXECUTE para PUBLIC por default do PostgreSQL,
      # e só não fica exposta se a própria migration revogar.
      #
      # Roda DENTRO do job `verify` de propósito: `Verify` já é contexto
      # obrigatório da branch protection da main, então a asserção passa a
      # bloquear sem depender de mexer em configuração de repositório.
      #
      # Custo declarado: acrescenta o tempo de subir a stack ao job mais
      # frequente do CI. É deliberado — a alternativa (job separado) exigiria
      # registrar um novo contexto obrigatório, e um contexto que alguém
      # esquece de registrar não protege nada.
      #
      # O estado avaliado é "as migrations do repositório aplicadas a um banco
      # limpo", que é o que um ambiente novo recebe.
      # ────────────────────────────────────────────────────────────────────
      - name: Instalar postgresql-client-17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "PGBIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Subir stack descartável e aplicar as migrations do repositório
        run: |
          set -o pipefail
          supabase init --force
          supabase start --exclude realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor
          echo "DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      - name: Guarda — a conexão é loopback
        run: |
          HOST=$(printf '%s' "$DB_URL" | sed -E 's#^[^@]*@([^:/]+).*#\1#')
          echo "host: $HOST"
          case "$HOST" in
            localhost|127.0.0.1|::1) echo "confere: banco local descartável" ;;
            *) echo "FALHA: o CI não pode se conectar a $HOST"; exit 1 ;;
          esac

      - name: Nenhuma rotina de public concede EXECUTE a PUBLIC
        run: '"$PGBIN/psql" "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/ci/assert-no-public-execute.sql'

      # ────────────────────────────────────────────────────────────────────
      # SEGURANÇA DO SCHEMA `billing` (Etapa 12A)
      #
      # A fundação de planos vive num schema próprio, fora de `public`, para
      # não perturbar as âncoras do migration-rebuild-verify — e, pelo mesmo
      # motivo, fora do alcance da asserção acima, que varre só `public`.
      #
      # Trocar uma cobertura por nenhuma seria regressão. Este passo é a
      # cobertura equivalente, e vai além: além de conferir catálogo (RLS,
      # policies, privilégios, triggers), EXECUTA o comportamento — insere,
      # tenta alterar, tenta apagar, e exige que o banco recuse. Tudo em
      # transação encerrada por ROLLBACK, contra a mesma stack descartável.
      #
      # "A trigger existe" e "a trigger funciona" são afirmações diferentes.
      # Só a segunda vale como prova.
      # ────────────────────────────────────────────────────────────────────
      - name: Segurança e imutabilidade do schema billing
        run: '"$PGBIN/psql" "$DB_URL" -v ON_ERROR_STOP=1 -f scripts/ci/assert-billing-security.sql'

      # ────────────────────────────────────────────────────────────────────
      # RECONSTRUÇÃO DESCARTÁVEL — o que a rota de produção fará, ensaiado
      #
      # Quatro afirmações que só um banco de verdade sustenta:
      #
      #   1. as 36 históricas continuam byte-idênticas ao manifesto (md5_norm);
      #   2. o VERIFICADOR INDEPENDENTE da nova migration aprova o estado
      #      reconstruído — é o mesmo arquivo que a rota executará em produção,
      #      então um defeito nele aparece aqui, e não lá;
      #   3. o ROLLBACK desfaz de verdade, restaurando is_active ao valor real;
      #   4. a REAPLICAÇÃO devolve o estado, provando idempotência.
      #
      # Tudo contra a stack local. Nenhum acesso remoto, nenhuma credencial.
      # ────────────────────────────────────────────────────────────────────
      - name: 36/36 hashes das históricas contra o manifesto
        run: node tests/verify-recovered-migrations.mjs supabase/migrations

      - name: Verificador independente da nova forward-only
        run: |
          set -o pipefail
          "$PGBIN/psql" "$DB_URL" -v ON_ERROR_STOP=1 \
            -f scripts/ci/verify-applied/20260801120000.sql

      - name: Rollback e reaplicação da nova forward-only
        run: |
          set -o pipefail
          P() { "$PGBIN/psql" "$DB_URL" -v ON_ERROR_STOP=1 "$@"; }

          echo "== estado ANTES do rollback =="
          P -At -c "SELECT slug, coalesce(is_active::text,'NULO') FROM public.subscription_plans ORDER BY slug;" \
            | tee /tmp/planos-antes.txt
          ANTES=$(P -At -c "SELECT count(*) FROM pg_namespace WHERE nspname='billing';")
          [ "$ANTES" = "1" ] || { echo "FALHA: schema billing ausente antes do rollback"; exit 1; }

          echo "== rollback =="
          P -f supabase/rollbacks/20260801120000_billing_foundation_rollback.sql

          DEPOIS=$(P -At -c "SELECT count(*) FROM pg_namespace WHERE nspname='billing';")
          [ "$DEPOIS" = "0" ] || { echo "FALHA: o schema billing sobreviveu ao rollback"; exit 1; }

          echo "== planos APÓS o rollback (devem voltar ao estado original) =="
          P -At -c "SELECT slug, coalesce(is_active::text,'NULO') FROM public.subscription_plans ORDER BY slug;" \
            | tee /tmp/planos-rollback.txt
          # No banco reconstruído os três nasceram ativos (seed de 20260724161707),
          # então o rollback tem de devolvê-los a `true`. Um `false` remanescente
          # significaria rollback incompleto.
          if grep -qv '|true$' /tmp/planos-rollback.txt; then
            echo "FALHA: plano não voltou a ativo após o rollback"
            grep -v '|true$' /tmp/planos-rollback.txt
            exit 1
          fi

          echo "== reaplicação =="
          P -f supabase/migrations/20260801120000_billing_foundation.sql

          echo "== verificador independente, de novo =="
          P -f scripts/ci/verify-applied/20260801120000.sql

          P -At -c "SELECT slug, coalesce(is_active::text,'NULO') FROM public.subscription_plans ORDER BY slug;" \
            > /tmp/planos-reaplicado.txt
          diff -u /tmp/planos-antes.txt /tmp/planos-reaplicado.txt \
            || { echo "FALHA: reaplicar não reproduziu o mesmo estado"; exit 1; }
          echo "rollback e reaplicação conferem — estado idêntico ao inicial"


      # ────────────────────────────────────────────────────────────────────
      # LEITURA DO LEDGER — contra psql de verdade
      #
      # A estreia da rota de aplicação falhou porque o passo de leitura do
      # ledger recebia `BEGIN` e `ROLLBACK` junto com os registros: eram os
      # tags de status que o psql imprime para cada comando do bloco
      # `BEGIN ... ROLLBACK`. Nenhuma fixture teria previsto isso — só o psql
      # sabe o que o psql imprime.
      #
      # Por isso a mesma implementação usada pela rota roda aqui, contra a
      # stack descartável que este job já sobe. Uma fixture que reproduz a
      # expectativa provaria apenas que o autor e o teste concordam.
      # ────────────────────────────────────────────────────────────────────
      - name: Leitura do ledger — implementação da rota, contra psql real
        run: |
          set -o pipefail
          # Conexão local descartável, decomposta em PG* como a rota faz.
          # `parse-db-url.mjs` não serve aqui: ele exige o alvo de produção.
          export PGHOST=$(printf '%s' "$DB_URL" | sed -E 's#^[^@]*@([^:/]+).*#\1#')
          export PGPORT=$(printf '%s' "$DB_URL" | sed -E 's#^.*:([0-9]+)/.*#\1#')
          export PGUSER=$(printf '%s' "$DB_URL" | sed -E 's#^postgres(ql)?://([^:]+):.*#\2#')
          export PGPASSWORD=$(printf '%s' "$DB_URL" | sed -E 's#^postgres(ql)?://[^:]+:([^@]*)@.*#\2#')
          export PGDATABASE=postgres
          case "$PGHOST" in
            localhost|127.0.0.1|::1) ;;
            *) echo "FALHA: este passo só roda contra o descartável local"; exit 1 ;;
          esac

          bash scripts/ci/read-remote-ledger.sh /tmp/ledger-local.tsv

          echo "== conteúdo lido =="
          cat /tmp/ledger-local.tsv

          # O que o defeito produzia, e que não pode voltar.
          if grep -qE '^(BEGIN|ROLLBACK|COMMIT|SET)$' /tmp/ledger-local.tsv; then
            echo "FALHA: tag de status do psql entrou no arquivo do ledger"
            exit 1
          fi

          # Toda linha no formato exigido, e a contagem tem de bater com o
          # número de migrations do repositório — aqui todas estão aplicadas.
          if grep -qvE '^[0-9]{14}\|.+$' /tmp/ledger-local.tsv; then
            echo "FALHA: linha fora do formato <14 dígitos>|<nome>"
            grep -nvE '^[0-9]{14}\|.+$' /tmp/ledger-local.tsv
            exit 1
          fi
          LIDAS=$(wc -l < /tmp/ledger-local.tsv)
          ESPERADAS=$(ls -1 supabase/migrations/*.sql | wc -l)
          echo "lidas=$LIDAS  migrations no repositório=$ESPERADAS"
          [ "$LIDAS" -eq "$ESPERADAS" ] || {
            echo "FALHA: o ledger local devia ter uma linha por migration aplicada"; exit 1; }

          # E o validador estrito tem de aprovar o mesmo arquivo.
          node scripts/ci/assert-ledger-format.mjs /tmp/ledger-local.tsv /tmp/ledger-local.ok.tsv
          cmp /tmp/ledger-local.tsv /tmp/ledger-local.ok.tsv
          echo "leitura do ledger confere contra psql real"

      - name: Derrubar a stack
        if: always()
        run: supabase stop --no-backup || true

  # ══════════════════════════════════════════════════════════════════════════
  # GATE BLOQUEANTE — E2E sem banco e sem credenciais
  # ══════════════════════════════════════════════════════════════════════════
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --with-deps é necessário no runner Linux (bibliotecas de sistema).
      # Localmente, no Windows, usa-se apenas `playwright install chromium`.
      - name: Install Playwright browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════════
  # INFORMATIVO — não bloqueia o merge
  #
  # A linha de base é de 12 vulnerabilidades altas, todas de build-time/
  # dev-time, em duas cadeias transitivas (brace-expansion→minimatch→eslint e
  # postcss/sharp→next). Os "fixes" propostos pelo npm são destrutivos
  # (next@9.3.3, eslint-config-next@0.2.4), por isso `npm audit fix` NÃO é
  # executado — nem aqui, nem localmente.
  #
  # `continue-on-error` fica SOMENTE nos passos de audit, que retornam exit 1
  # por causa das vulnerabilidades conhecidas. No nível do job ele foi
  # removido: assim uma falha de infraestrutura (checkout, setup-node, npm ci)
  # continua visível como falha real, em vez de ser silenciada junto com o
  # resultado esperado do audit.
  #
  # Nenhum passo usa `|| true`: o código de saída real do comando é preservado
  # e aparece no log.
  # ══════════════════════════════════════════════════════════════════════════
  audit:
    name: Dependency audit (informativo)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit (high)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Save audit report
        continue-on-error: true
        run: npm audit --json > npm-audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-audit
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 30
